const {useState,useEffect,useMemo,useRef}=React;
const C={bg:"#080f1c",surface:"#101e33",card:"#162540",border:"#1e3352",primary:"#00d4f5",amber:"#f59e0b",red:"#f43f5e",green:"#10b981",violet:"#8b5cf6",rose:"#f472b6",text:"#e8f0fc",textDim:"#7b8fa8",textMuted:"#3d5470",white:"#fff"};
const mono="'JetBrains Mono',monospace",sans="'Outfit',system-ui,sans-serif";
const PEN_CODES=["DSQ","UFD","OCS","DNS","DNF","RET","DNC","BFD","DNE","RAF"];
const isPen=r=>typeof r==="string"&&PEN_CODES.includes((r||"").toUpperCase());
function ordinal(n){if(typeof n==='string')return n;const s=["th","st","nd","rd"];const v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function calcNet(results,penScore,racesCompleted,numDiscards){
  const valid=results.slice(0,racesCompleted).map((r,i)=>({i,score:r==null?null:(isPen(r)?penScore:Number(r))})).filter(s=>s.score!=null);
  if(!valid.length)return{net:0,total:0,discIdx:[]};
  const total=valid.reduce((s,x)=>s+x.score,0);
  const nd=racesCompleted>=4?numDiscards:0;
  const sorted=[...valid].sort((a,b)=>b.score-a.score);
  const discIdx=sorted.slice(0,Math.min(nd,valid.length)).map(s=>s.i);
  const net=total-discIdx.reduce((s,i)=>s+valid.find(v=>v.i===i).score,0);
  return{net,total,discIdx};
}

function compressScores(sailors){
  if(!sailors.length)return sailors;
  const orig=sailors.map(x=>({...x}));orig.sort((a,b)=>a.qualRank-b.qualRank);
  const adj=orig.map(x=>({...x,adjustedNet:x.qualNet}));
  for(let i=1;i<adj.length;i++){const g=orig[i].qualNet-orig[i-1].qualNet;adj[i].adjustedNet=g>9?adj[i-1].adjustedNet+9:adj[i-1].adjustedNet+g;}
  if(adj.length>=3){const t=adj[2].adjustedNet;for(let i=3;i<adj.length;i++){if(adj[i].adjustedNet>t+18)adj[i].adjustedNet=t+18;}}
  return adj;
}
function calcFinalsOverall(a,f1,f2,ff){return a+(f1!=null?(isPen(f1)?ff+1:Number(f1)):0)+(f2!=null?(isPen(f2)?ff+1:Number(f2)):0);}

const SKEY="regatta-scorer-v1";
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function loadAll(){try{const d=localStorage.getItem(SKEY);return d?JSON.parse(d):{events:[]}}catch{return{events:[]}}}

function migrateOld(){try{const o=localStorage.getItem("sgs-scorer-v5");if(!o)return null;const d=JSON.parse(o);return{id:genId(),name:"SGS Regatta (imported)",date:"",created:Date.now(),lastModified:Date.now(),prelim:d.prelim||{config:{totalEntries:200,numFleets:3,totalRaces:5,racesCompleted:0},mySailors:[]},elim:d.elim||{config:{goldFleetSize:67,totalRaces:7,racesCompleted:0},mySailors:[]},sailors:d.sailors||[],finalsFleet:d.finalsFleet||10,focusIdx:null};}catch{return null}}

function useBreakpoint(){
  const [w,setW]=useState(()=>window.innerWidth);
  useEffect(()=>{const fn=()=>setW(window.innerWidth);window.addEventListener('resize',fn,{passive:true});return()=>window.removeEventListener('resize',fn)},[]);

}

// ═══════════════════════════════════════
// AI IMPORT (IMAGE + URL)
// ═══════════════════════════════════════
const APIKEY_SKEY="regatta-claude-key";
function loadApiKey(){try{return localStorage.getItem(APIKEY_SKEY)||""}catch{return""}}
function saveApiKey(k){try{localStorage.setItem(APIKEY_SKEY,k)}catch{}}

const AI_PROMPT=`This is a sailing regatta results sheet. Find these sailors and return their finishing position in each race column.

Sailors to find: {NAMES}

Return ONLY valid JSON, no explanation:
{
  "races": <number of race columns found>,
  "results": {
    "<SailorName exactly as given>": [pos_r1, pos_r2, ...]
  }
}

Rules:
- Match sailor names case-insensitively, use the name exactly as provided above
- Positions are integers (1, 2, 3...)
- Penalties stay as strings: "DSQ","DNF","DNS","OCS","UFD","BFD","DNC","RET"
- Use null if a result is unclear or missing for that race
- Omit sailors not found in the sheet at all`;

async function callClaude(content,apiKey){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:2048,messages:[{role:"user",content}]})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||"API error "+res.status)}
  const data=await res.json();
  const text=data.content[0].text.trim();
  const m=text.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("Couldn't parse JSON from AI response — try a clearer source");
  return JSON.parse(m[0]);
}

async function extractFromImage(base64,mime,sailorNames,apiKey){
  return callClaude([
    {type:"image",source:{type:"base64",media_type:mime,data:base64}},
    {type:"text",text:AI_PROMPT.replace("{NAMES}",sailorNames.join(", "))}
  ],apiKey);
}

async function fetchPageText(url){
  // Try direct fetch first; fall back to CORS proxy
  const proxies=["","https://api.allorigins.win/get?url=","https://corsproxy.io/?"];
  for(const proxy of proxies){
    try{
      const r=await fetch(proxy+encodeURIComponent(url),{signal:AbortSignal.timeout(10000)});
      if(!r.ok)continue;
      if(proxy.includes("allorigins")){const j=await r.json();return j.contents||""}
      return await r.text();
    }catch{}
  }
  throw new Error("Couldn't load the page. The site may block external access — try the screenshot option instead.");
}

function stripHtml(html){
  // Keep table structure as plain text for Claude to parse
  return html
    .replace(/<style[^>]*>[\s\S]*?<\/style>/gi,"")
    .replace(/<script[^>]*>[\s\S]*?<\/script>/gi,"")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<\/tr>/gi,"\n")
    .replace(/<\/td>|<\/th>/gi,"\t")
    .replace(/<[^>]+>/g,"")
    .replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&nbsp;/g," ").replace(/&#\d+;/g," ")
    .replace(/[ \t]+/g," ").replace(/\n[ \t]+/g,"\n").replace(/\n{3,}/g,"\n\n").trim()
    .slice(0,30000); // cap to avoid huge token bills
}

async function extractFromUrl(url,sailorNames,apiKey){
  const html=await fetchPageText(url);
  const text=stripHtml(html);
  if(text.length<100)throw new Error("Page loaded but no readable content found — try screenshot instead");
  return callClaude([
    {type:"text",text:"The following is the text content of a sailing regatta results page (URL: "+url+").\n\n"+text+"\n\n---\n\n"+AI_PROMPT.replace("{NAMES}",sailorNames.join(", "))}
  ],apiKey);
}

// Shared results preview + apply UI
function ResultsPreview({extracted,sailors,onApply,onClose}){
  const foundNames=Object.keys(extracted.results);
  const notFound=sailors.map(s=>s.name).filter(n=>!foundNames.find(f=>f.toLowerCase()===n.toLowerCase()));

    <div style={{padding:"10px 14px",borderRadius:6,background:C.green+"12",border:"1px solid "+C.green+"30"}}>
      <div style={{fontSize:13,color:C.green,fontWeight:700}}>Found {foundNames.length}/{sailors.length} sailors · {extracted.races} race{extracted.races!==1?"s":""} detected</div>
      {notFound.length>0&&<div style={{fontSize:12,color:C.amber,marginTop:4}}>Not found: {notFound.join(", ")}</div>}
    </div>
    <div style={{overflowX:"auto",borderRadius:6,border:"1px solid "+C.border}}>
      <table style={{fontFamily:mono,fontSize:13}}>
        <thead><tr style={{borderBottom:"2px solid "+C.border,background:C.surface}}>
          <th style={{textAlign:"left",color:C.textDim,padding:"8px 12px",fontSize:11,fontFamily:sans,fontWeight:700}}>Sailor</th>
          {Array.from({length:extracted.races},(_,i)=><th key={i} style={{textAlign:"center",color:C.primary,padding:"8px 8px",fontSize:11,minWidth:36}}>R{i+1}</th>)}
        </tr></thead>
        <tbody>{foundNames.map((name,i)=><tr key={i} style={{borderBottom:"1px solid "+C.border+"22"}}>
          <td style={{padding:"8px 12px",color:C.white,fontFamily:sans,fontWeight:600}}>{name}</td>
          {extracted.results[name].map((r,j)=><td key={j} style={{padding:"8px",textAlign:"center",color:r==null?C.textMuted:isPen(r)?C.red:C.green,fontWeight:r!=null?700:400}}>{r??"-"}</td>)}
        </tr>)}</tbody>
      </table>
    </div>
    <button onClick={()=>{onApply(extracted);onClose()}} style={{width:"100%",padding:"13px",borderRadius:8,border:"none",background:C.green,color:C.white,fontFamily:sans,fontSize:15,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 16px "+C.green+"44"}}>
      Apply Results to My Sailors ✓
    </button>
  </div>;
}

function ImportModal({sailors,onApply,onClose}){
  const [mode,setMode]=useState("url"); // "url" | "image"
  const [apiKey,setApiKey]=useState(()=>loadApiKey());
  const [showKey,setShowKey]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [extracted,setExtracted]=useState(null);
  // URL mode
  const [url,setUrl]=useState("");
  // Image mode
  const [imgPreview,setImgPreview]=useState(null);
  const [imgBase64,setImgBase64]=useState(null);
  const [imgMime,setImgMime]=useState(null);
  const fileRef=useRef();

  const reset=()=>{setExtracted(null);setError(null)};
  const switchMode=(m)=>{setMode(m);reset()};

  const handleFile=(file)=>{
    if(!file||!file.type.startsWith("image/"))return;
    setImgMime(file.type);reset();
    const r=new FileReader();
    r.onload=(e)=>{setImgPreview(e.target.result);setImgBase64(e.target.result.split(",")[1])};
    r.readAsDataURL(file);
  };

  const doExtract=async()=>{
    if(!apiKey.trim()){setError("Enter your Claude API key first");return}
    saveApiKey(apiKey);setLoading(true);setError(null);setExtracted(null);
    try{
      let result;
      if(mode==="url"){
        if(!url.trim()){setError("Enter a URL first");setLoading(false);return}
        result=await extractFromUrl(url.trim(),sailors.map(s=>s.name),apiKey);
      }else{
        if(!imgBase64){setError("Upload an image first");setLoading(false);return}
        result=await extractFromImage(imgBase64,imgMime,sailors.map(s=>s.name),apiKey);
      }
      setExtracted(result);
    }catch(e){setError(e.message)}
    setLoading(false);
  };

  const inp={padding:"9px 12px",borderRadius:6,border:"1px solid "+C.border,background:C.surface,color:C.text,fontSize:14,fontFamily:sans};
  const canRun=!loading&&sailors.length>0&&(mode==="url"?url.trim().length>0:!!imgBase64);

  return<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(3px)"}}>
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:14,width:"100%",maxWidth:560,maxHeight:"93vh",overflowY:"auto",boxShadow:"0 32px 80px rgba(0,0,0,0.7)"}}>

      {/* Header */}
      <div style={{padding:"18px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"sticky",top:0,background:C.card,zIndex:1,paddingBottom:0}}>
        <div style={{flex:1}}>
          <div style={{fontSize:16,fontWeight:700,color:C.white,marginBottom:2}}>Import Results</div>
          <div style={{fontSize:12,color:C.textMuted}}>AI finds your sailors and fills in their race results automatically</div>
        </div>
        <button onClick={onClose} style={{background:"none",border:"1px solid "+C.border,borderRadius:6,color:C.textDim,fontSize:16,cursor:"pointer",width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginLeft:12}}>✕</button>
      </div>

      {/* Mode tabs */}
      <div style={{display:"flex",gap:0,margin:"14px 20px 0",background:C.surface,borderRadius:8,border:"1px solid "+C.border,overflow:"hidden"}}>
        {[{k:"url",label:"🔗 From URL",desc:"Paste a results page link"},{k:"image",label:"📷 From Image",desc:"Upload a screenshot"}].map(t=>
          <button key={t.k} onClick={()=>switchMode(t.k)} style={{flex:1,padding:"10px 8px",background:mode===t.k?C.violet+"20":"transparent",border:"none",borderBottom:mode===t.k?"2px solid "+C.violet:"2px solid transparent",color:mode===t.k?C.violet:C.textDim,cursor:"pointer",fontFamily:sans,fontWeight:mode===t.k?700:400,fontSize:13}}>
            {t.label}
          </button>)}
      </div>

      <div style={{padding:"16px 20px 20px",display:"flex",flexDirection:"column",gap:14}}>

        {/* API key */}
        <div>
          <div style={{fontSize:11,color:C.textDim,marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px"}}>Claude API Key</div>
          <div style={{display:"flex",gap:6}}>
            <input type={showKey?"text":"password"} placeholder="sk-ant-api03-..." value={apiKey} onChange={e=>setApiKey(e.target.value)} style={{...inp,fontFamily:mono,fontSize:12,flex:1}}/>
            <button onClick={()=>setShowKey(!showKey)} style={{padding:"9px 12px",borderRadius:6,border:"1px solid "+C.border,background:C.surface,color:C.textDim,cursor:"pointer",fontSize:12,flexShrink:0}}>{showKey?"Hide":"Show"}</button>
          </div>
          <div style={{fontSize:11,color:C.textMuted,marginTop:3}}>Stored locally in your browser only · <a href="https://console.anthropic.com" target="_blank" rel="noreferrer" style={{color:C.primary}}>Get a key</a></div>
        </div>

        {/* URL input */}
        {mode==="url"&&<div>
          <div style={{fontSize:11,color:C.textDim,marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px"}}>Results Page URL</div>
          <input value={url} onChange={e=>{setUrl(e.target.value);reset()}} onKeyDown={e=>e.key==="Enter"&&doExtract()} placeholder="https://yachtscoring.com/event_results.cfm?..." style={{...inp,width:"100%",fontFamily:mono,fontSize:12}}/>
          <div style={{fontSize:11,color:C.textMuted,marginTop:3}}>Works with most public results sites: Yachtscoring, Sailwave, Regatta Network, etc.</div>
        </div>}

        {/* Image upload */}
        {mode==="image"&&<div>
          <div style={{fontSize:11,color:C.textDim,marginBottom:5,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px"}}>Results Sheet Image</div>
          <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0])}} onClick={()=>fileRef.current.click()} style={{border:"2px dashed "+(imgPreview?C.violet:C.border),borderRadius:8,padding:imgPreview?"8px":"24px 16px",textAlign:"center",cursor:"pointer",background:C.surface}}>
            {imgPreview
              ?<img src={imgPreview} style={{maxWidth:"100%",maxHeight:180,borderRadius:6,objectFit:"contain"}} alt="preview"/>
              :<div><div style={{fontSize:28,marginBottom:6}}>📋</div><div style={{color:C.textDim,fontSize:13,fontWeight:600}}>Drag & drop or click to upload</div><div style={{color:C.textMuted,fontSize:11,marginTop:3}}>PNG, JPG, screenshot of results sheet</div></div>}
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
          {imgPreview&&<button onClick={()=>{setImgPreview(null);setImgBase64(null);reset()}} style={{marginTop:5,background:"none",border:"none",color:C.textMuted,fontSize:11,cursor:"pointer",padding:0}}>Remove ✕</button>}
        </div>}

        {/* Sailors list */}
        <div style={{padding:"10px 14px",borderRadius:6,background:C.surface,border:"1px solid "+C.border}}>
          <div style={{fontSize:11,color:C.textDim,marginBottom:5,fontWeight:700}}>Searching for {sailors.length} sailor{sailors.length!==1?"s":""}:</div>
          {sailors.length>0
            ?<div style={{display:"flex",flexWrap:"wrap",gap:4}}>{sailors.map((s,i)=><Badge key={i} color={C.primary}>{s.name}</Badge>)}</div>
            :<div style={{fontSize:12,color:C.textMuted}}>Add sailors first, then import their results</div>}
        </div>

        {error&&<div style={{padding:"10px 14px",borderRadius:6,background:C.red+"15",border:"1px solid "+C.red+"33",color:C.red,fontSize:13,lineHeight:1.5}}>{error}</div>}

        <button onClick={doExtract} disabled={!canRun} style={{padding:"12px",borderRadius:8,border:"none",background:canRun?"linear-gradient(135deg,"+C.violet+","+C.primary+")":C.surface,color:canRun?C.white:C.textMuted,fontFamily:sans,fontSize:14,fontWeight:700,cursor:canRun?"pointer":"not-allowed"}}>
          {loading?(mode==="url"?"🔗 Fetching & extracting...":"🔍 Extracting results..."):(mode==="url"?"Extract from URL":"Extract from Image")}
        </button>

        {extracted&&<ResultsPreview extracted={extracted} sailors={sailors} onApply={onApply} onClose={onClose}/>}
      </div>
    </div>
  </div>;
}

function Card({children,style,highlight,accent}){return<div style={{background:C.card,borderRadius:10,border:"1px solid "+(highlight?C.primary+"55":C.border),padding:16,position:"relative",overflow:"hidden",...style}}>{accent&&<div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:accent,borderRadius:"10px 0 0 10px"}}/>}{children}</div>}
function Badge({children,color=C.primary}){return<span style={{display:"inline-block",padding:"2px 8px",borderRadius:20,background:color+"25",color,fontSize:11,fontFamily:mono,fontWeight:700,letterSpacing:"0.3px"}}>{children}</span>}
function SectionTitle({children,color}){return<h3 style={{color:color||C.primary,fontFamily:sans,fontSize:12,margin:"0 0 12px",textTransform:"uppercase",letterSpacing:"1.5px",fontWeight:700}}>{children}</h3>}
function NumberStepper({label,value,onChange,min=0,max=999}){
  const [draft,setDraft]=useState(String(value));
  const [focused,setFocused]=useState(false);
  useEffect(()=>{if(!focused)setDraft(String(value))},[value,focused]);
  const commit=()=>{const v=parseInt(draft,10);const clamped=!isNaN(v)?Math.min(max,Math.max(min,v)):value;setDraft(String(clamped));onChange(clamped)};
  const bs={width:32,height:36,borderRadius:7,border:"1px solid "+C.border,background:C.surface,color:C.primary,fontSize:18,cursor:"pointer",fontFamily:mono,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,flexShrink:0};
  return<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 0",borderBottom:"1px solid "+C.border+"44"}}>
    <span style={{color:C.text,fontFamily:sans,fontSize:14}}>{label}</span>
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <button onClick={()=>onChange(Math.max(min,value-1))} style={bs}>−</button>
      <input
        type="text" inputMode="numeric" pattern="[0-9]*"
        value={draft}
        onChange={e=>setDraft(e.target.value.replace(/[^0-9]/g,""))}
        onFocus={e=>{setFocused(true);e.target.select()}}
        onBlur={()=>{setFocused(false);commit()}}
        onKeyDown={e=>{if(e.key==="Enter"){commit();e.target.blur()}}}
        style={{width:64,padding:"5px 6px",borderRadius:7,border:"1px solid "+C.border,background:C.surface,color:C.white,fontFamily:mono,fontSize:18,fontWeight:800,textAlign:"center"}}
      />
      <button onClick={()=>onChange(Math.min(max,value+1))} style={bs}>+</button>
    </div>
  </div>
}

// Position grid for entering results
function PosGrid({fleetSize,result,onSet,onClear}){
  return<div>
    <div style={{display:"grid",gridTemplateColumns:"repeat("+Math.min(fleetSize,10)+",1fr)",gap:4,marginBottom:8}}>
      {Array.from({length:fleetSize},(_,p)=>{const pos=p+1;const sel=result===pos;return<button key={pos} onClick={()=>onSet(pos)} style={{padding:"8px 2px",borderRadius:4,border:"1px solid "+(sel?C.primary:C.border),background:sel?C.primary:C.surface,color:sel?C.bg:C.text,fontFamily:mono,fontSize:13,fontWeight:700,cursor:"pointer"}}>{pos}</button>})}
    </div>
    <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      {["DSQ","UFD","OCS","DNS","DNF","BFD"].map(code=>{const sel=result===code;return<button key={code} onClick={()=>onSet(code)} style={{padding:"6px 10px",borderRadius:4,border:"1px solid "+(sel?C.red:C.red+"44"),background:sel?C.red:C.red+"15",color:sel?C.white:C.red,fontFamily:mono,fontSize:11,fontWeight:700,cursor:"pointer"}}>{code}</button>})}
    </div>
  </div>;
}

// Status badge based on net vs cutoff
function StatusBadge({net,optimistic,expected,pessimistic}){
  if(net<=optimistic)return<Badge color={C.green}>SAFE</Badge>;
  if(net<=expected)return<Badge color={C.primary}>ON TRACK</Badge>;
  if(net<=pessimistic)return<Badge color={C.amber}>CLOSE</Badge>;
  return<Badge color={C.red}>AT RISK</Badge>;
}

function estimateGoldCutoff(totalEntries,numFleets,totalRaces){
  if(numFleets<=1)return{singleFleet:true,fs:totalEntries,pen:totalEntries+1,totalRaces,hasDisc:totalRaces>=4,cr:totalRaces>=4?totalRaces-1:totalRaces};
  const gs=Math.ceil(totalEntries/numFleets);const fs=gs;const pen=fs+1;
  const avg=Math.round(fs/numFleets);const hasDisc=totalRaces>=4;const cr=hasDisc?totalRaces-1:totalRaces;
  const effCr=hasDisc?cr-0.5:cr;
  const exp=Math.round(avg*effCr);return{singleFleet:false,gs,fs,pen,avg,cr,exp,opt:Math.round(exp*0.85),pes:Math.round(exp*1.15),totalRaces,hasDisc};
}

// PRELIM VIEW
// ═══════════════════════════════════════
function PrelimView({prelim,setPrelim,setElim,goToElim}){
  const {config,mySailors}=prelim;
  const setConfig=(fn)=>setPrelim(p=>({...p,config:fn(p.config)}));
  const setSailors=(fn)=>setPrelim(p=>({...p,mySailors:fn(p.mySailors)}));
  const [newName,setNewName]=useState("");
  const [expS,setExpS]=useState(null);
  const [expR,setExpR]=useState(null);
  const [showImport,setShowImport]=useState(false);
  const [promoteMsg,setPromoteMsg]=useState(null);

  const promoteToElim=()=>{
    const est=estimateGoldCutoff(config.totalEntries,config.numFleets,config.totalRaces);
    // Score all sailors and rank them
    const scored=mySailors.map(s=>{
      const sc=calcNet(s.results,est.pen,config.racesCompleted,1);
      return{name:s.name,net:sc.net,filled:s.results.filter(r=>r!=null).length};
    });
    scored.sort((a,b)=>a.net-b.net);
    const ranked=scored.map((s,i)=>({...s,rank:i+1}));
    // Push into elim mySailors — skip any already present by name
    setElim(prev=>{
      const existing=prev.mySailors.map(s=>s.name.toLowerCase());
      const toAdd=ranked
        .filter(s=>!existing.includes(s.name.toLowerCase()))
        .map(s=>({name:s.name,prelimRank:s.rank,results:[]}));
      const added=toAdd.length;
      setPromoteMsg(added>0?`Promoted ${added} sailor${added!==1?"s":""} to Elimination (${ranked.length-added} already there)`:"All sailors already in Elimination");
      setTimeout(()=>setPromoteMsg(null),4000);
      if(added===0)return prev;
      return{...prev,mySailors:[...prev.mySailors,...toAdd]};
    });
    if(goToElim)goToElim();
  };
  const handleImport=(extracted)=>{
    const n=extracted.races;
    setConfig(c=>({...c,totalRaces:Math.max(c.totalRaces,n),racesCompleted:Math.min(Math.max(c.racesCompleted,n),Math.max(c.totalRaces,n))}));
    setSailors(prev=>prev.map(sailor=>{
      const key=Object.keys(extracted.results).find(k=>k.toLowerCase()===sailor.name.toLowerCase());
      if(!key)return sailor;
      const nr=[...sailor.results];
      extracted.results[key].forEach((r,i)=>{while(nr.length<=i)nr.push(null);if(r!=null)nr[i]=r});
      return{...sailor,results:nr};
    }));
  };
  const est=useMemo(()=>estimateGoldCutoff(config.totalEntries,config.numFleets,config.totalRaces),[config]);
  const addS=()=>{if(!newName.trim())return;setSailors(p=>[...p,{name:newName.trim(),results:[]}]);setNewName("")};
  const remS=(i)=>setSailors(p=>p.filter((_,j)=>j!==i));
  const setRes=(si,ri,val)=>{setSailors(p=>p.map((s,i)=>{if(i!==si)return s;const nr=[...s.results];while(nr.length<=ri)nr.push(null);nr[ri]=val;return{...s,results:nr}}));if(ri<config.racesCompleted-1)setExpR(ri+1);else setExpR(null)};
  const clrRes=(si,ri)=>setSailors(p=>p.map((s,i)=>{if(i!==si)return s;const nr=[...s.results];nr[ri]=null;return{...s,results:nr}}));

  return<div style={{display:"flex",flexDirection:"column",gap:16}}>
    <Card accent={C.primary}><SectionTitle>Preliminary Series Config</SectionTitle>
      <NumberStepper label="Total Entries" value={config.totalEntries} onChange={v=>setConfig(c=>({...c,totalEntries:v}))} min={10} max={400}/>
      <NumberStepper label="Fleets" value={config.numFleets} onChange={v=>setConfig(c=>({...c,numFleets:v}))} min={1} max={4}/>
      <NumberStepper label="Total Races" value={config.totalRaces} onChange={v=>setConfig(c=>({...c,totalRaces:v}))} min={1} max={10}/>
      <NumberStepper label="Races Completed" value={config.racesCompleted} onChange={v=>setConfig(c=>({...c,racesCompleted:Math.min(v,config.totalRaces)}))} min={0} max={config.totalRaces}/>
      <div style={{marginTop:8,display:"flex",gap:12,flexWrap:"wrap",fontSize:11,color:C.textMuted}}>
        {est.singleFleet
          ?<span style={{color:C.amber}}>Single fleet — all {config.totalEntries} boats race together, no gold/silver split</span>
          :<><span>Fleet: ~{est.fs}</span><span>Pen: {est.pen}</span><span>Disc: {config.racesCompleted>=4?"1":"0"}</span><span>Gold: top {est.gs}</span></>}
      </div>
    </Card>
    {!est.singleFleet&&<Card highlight accent={C.green}><SectionTitle color={C.green}>Gold Fleet Cutoff</SectionTitle>
      {est.hasDisc&&<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"8px 12px",borderRadius:6,background:C.amber+"12",border:"1px solid "+C.amber+"30"}}>
        <span style={{fontFamily:mono,fontSize:11,color:C.amber}}>{est.totalRaces} races sailed</span>
        <span style={{color:C.textMuted,fontSize:11}}>→</span>
        <span style={{fontFamily:mono,fontSize:11,color:C.red}}>drop 1 worst</span>
        <span style={{color:C.textMuted,fontSize:11}}>→</span>
        <span style={{fontFamily:mono,fontSize:11,color:C.green,fontWeight:700}}>{est.cr} counting</span>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
        {[{v:est.opt,l:"COMFORTABLE",c:C.green},{v:est.exp,l:"PROJECTED",c:C.primary,hl:true},{v:est.pes,l:"TIGHT",c:C.amber}].map((x,i)=>
          <div key={i} style={{background:C.surface,borderRadius:6,padding:"10px 8px",textAlign:"center",border:x.hl?"1px solid "+C.primary+"33":"none"}}>
            <div style={{fontFamily:mono,fontSize:22,fontWeight:700,color:x.c}}>{x.v}</div>
            <div style={{fontFamily:sans,fontSize:10,color:C.textMuted,marginTop:2}}>{x.l}</div></div>)}
      </div>
      <div style={{fontSize:12,color:C.textDim,lineHeight:1.8}}>
        To qualify gold fleet (top {est.gs}), target avg <b style={{color:C.white}}>~{ordinal(est.avg)}</b> per race over <b style={{color:C.white}}>{est.cr} counting races</b>
        {est.hasDisc&&<span style={{color:C.amber}}> — one worst result dropped</span>}
      </div>
    </Card>}
    {showImport&&<ImportModal sailors={mySailors} onApply={handleImport} onClose={()=>setShowImport(false)}/>}
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><SectionTitle>My Sailors</SectionTitle><Badge>{mySailors.length}</Badge></div>
        <button onClick={()=>setShowImport(true)} style={{padding:"7px 14px",borderRadius:7,border:"1px solid "+C.violet+"55",background:"linear-gradient(135deg,"+C.violet+"25,"+C.primary+"15)",color:C.violet,fontFamily:sans,fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>📋 Import Results</button>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <input placeholder="Sailor name" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addS()} style={{flex:1,padding:"10px 12px",borderRadius:6,border:"1px solid "+C.border,background:C.surface,color:C.text,fontSize:14,fontFamily:sans}}/>
        <button onClick={addS} style={{padding:"10px 16px",borderRadius:6,border:"none",background:C.primary,color:C.bg,fontFamily:sans,fontSize:14,fontWeight:700,cursor:"pointer"}}>+</button>
      </div>
      {mySailors.map((sailor,si)=>{
        const sc=calcNet(sailor.results,est.pen,config.racesCompleted,1);const filled=sailor.results.filter(r=>r!=null).length;const isE=expS===si;
        const rL=config.totalRaces-config.racesCompleted;const pR=est.exp-sc.net;const aN=rL>0?Math.ceil(Math.max(0,pR)/rL):0;
        return<div key={si} style={{marginBottom:8}}><Card style={{padding:0,overflow:"hidden"}}>
          <div onClick={()=>{setExpS(isE?null:si);setExpR(null)}} style={{padding:"14px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontFamily:sans,fontSize:14,color:C.white,fontWeight:600}}>{sailor.name}</span><Badge color={C.textDim}>{filled}/{config.racesCompleted}R</Badge></div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              {filled>0&&<><div style={{textAlign:"right"}}><div style={{fontFamily:mono,fontSize:16,fontWeight:700,color:C.primary}}>{sc.net}</div><div style={{fontFamily:sans,fontSize:9,color:C.textMuted}}>NET</div></div>
              <StatusBadge net={sc.net} optimistic={est.opt} expected={est.exp} pessimistic={est.pes}/></>}
              <span style={{color:C.textMuted,fontSize:12}}>{isE?"▲":"▼"}</span></div>
          </div>
          {isE&&<div style={{borderTop:"1px solid "+C.border}}>
            {filled>0&&<div style={{padding:"12px 16px",display:"flex",gap:8,flexWrap:"wrap"}}>
              {Array.from({length:config.racesCompleted},(_,ri)=>{const r=sailor.results[ri];const isD=sc.discIdx.includes(ri);
                return<div key={ri} style={{padding:"6px 10px",borderRadius:6,background:isD?C.amber+"15":C.surface,border:"1px solid "+(isD?C.amber+"44":C.border),textAlign:"center",minWidth:40}}>
                  <div style={{fontFamily:sans,fontSize:9,color:C.textMuted}}>R{ri+1}</div>
                  <div style={{fontFamily:mono,fontSize:14,fontWeight:700,color:r==null?C.textMuted:isPen(r)?C.red:isD?C.amber:C.white,textDecoration:isD?"line-through":"none"}}>{r??"-"}</div></div>})}
              <div style={{padding:"6px 10px",borderRadius:6,background:C.primary+"15",border:"1px solid "+C.primary+"33",textAlign:"center"}}><div style={{fontFamily:sans,fontSize:9,color:C.primary}}>NET</div><div style={{fontFamily:mono,fontSize:14,fontWeight:700,color:C.primary}}>{sc.net}</div></div>
            </div>}
            {rL>0&&filled>0&&<div style={{padding:"8px 16px",background:C.surface,borderTop:"1px solid "+C.border+"22"}}>
              {pR<=0?<div style={{fontSize:12,color:C.green}}>✓ Under projected cutoff{est.hasDisc&&sc.discIdx.length>0?" (drop applied)":""}</div>:
              <div style={{fontSize:12,color:C.textDim}}>
                Need <b style={{color:C.white}}>{pR} pts</b> in <b style={{color:C.white}}>{rL} races</b> → avg <b style={{color:aN<=est.avg?C.green:C.amber}}>{ordinal(aN)}</b> or better
                {est.hasDisc&&config.racesCompleted<4&&<div style={{fontSize:11,color:C.amber,marginTop:3}}>Drop kicks in at race 4 — your worst result will be excluded from final net</div>}
                {est.hasDisc&&sc.discIdx.length>0&&<div style={{fontSize:11,color:C.primary,marginTop:3}}>Drop active — worst race excluded. Future races may improve or replace current drop</div>}
              </div>}
            </div>}
            <div style={{padding:"12px 16px"}}>{Array.from({length:config.racesCompleted},(_,ri)=>{
              const result=sailor.results[ri];const isRE=expR===ri;
              return<div key={ri} style={{marginBottom:4}}>
                <div onClick={()=>setExpR(isRE?null:ri)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",borderRadius:6,cursor:"pointer",background:isRE?C.surface:"transparent",border:"1px solid "+(isRE?C.border:"transparent")}}>
                  <span style={{color:C.textDim,fontFamily:mono,fontSize:13}}>R{ri+1}</span>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    {result!=null?<><span style={{fontFamily:mono,fontSize:16,fontWeight:700,color:isPen(result)?C.red:C.white}}>{isPen(result)?result:ordinal(result)}</span><button onClick={e=>{e.stopPropagation();clrRes(si,ri)}} style={{background:"none",border:"none",color:C.textMuted,cursor:"pointer",fontSize:12}}>✕</button></>:<span style={{color:C.textMuted,fontSize:12}}>tap</span>}
                    <span style={{color:C.textMuted,fontSize:10}}>{isRE?"▲":"▼"}</span></div>
                </div>
                {isRE&&<div style={{padding:"8px 12px"}}><PosGrid fleetSize={est.fs} result={result} onSet={v=>setRes(si,ri,v)} onClear={()=>clrRes(si,ri)}/></div>}
              </div>})}</div>
            <div style={{padding:"8px 16px 12px",display:"flex",justifyContent:"flex-end"}}><button onClick={()=>remS(si)} style={{background:"none",border:"1px solid "+C.red+"44",borderRadius:6,color:C.red,fontSize:11,padding:"6px 12px",cursor:"pointer"}}>Remove</button></div>
          </div>}
        </Card></div>})}
      {!mySailors.length&&<div style={{color:C.textMuted,textAlign:"center",padding:20,fontSize:13}}>Add sailors above, or use Import Results to load from a results page</div>}
      {mySailors.length>0&&config.racesCompleted>0&&!est.singleFleet&&<div style={{marginTop:12,paddingTop:12,borderTop:"1px solid "+C.border+"44"}}>
        {promoteMsg&&<div style={{marginBottom:8,padding:"8px 12px",borderRadius:6,background:C.green+"15",border:"1px solid "+C.green+"33",color:C.green,fontSize:12}}>{promoteMsg}</div>}
        <button onClick={promoteToElim} style={{width:"100%",padding:"11px",borderRadius:8,border:"1px solid "+C.amber+"44",background:"linear-gradient(135deg,"+C.amber+"18,"+C.green+"10)",color:C.amber,fontFamily:sans,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          ⚔ Promote to Elimination Series →
        </button>
        <div style={{fontSize:11,color:C.textMuted,marginTop:5,textAlign:"center"}}>Ranks sailors by current net score and adds them to the Elim tab with their prelim rank</div>
      </div>}
    </Card>
  </div>;
}

// ELIMINATION VIEW
// ═══════════════════════════════════════
function ElimView({elim,setElim}){
  const {config,mySailors}=elim;
  const setConfig=(fn)=>setElim(p=>({...p,config:fn(p.config)}));
  const setSailors=(fn)=>setElim(p=>({...p,mySailors:fn(p.mySailors)}));
  const [newName,setNewName]=useState("");
  const [newPrelimRank,setNewPrelimRank]=useState("");
  const [expS,setExpS]=useState(null);
  const [expR,setExpR]=useState(null);

  const penScore=config.goldFleetSize+1;
  const finalsTop=10;

  // Estimate finals cutoff: top 10 out of gold fleet
  // With gold fleet of ~67, top 10 avg finish ~ fleet/6.7 ≈ 10th
  const estAvgFinish=Math.round(config.goldFleetSize/6.7);
  const countingRaces=config.totalRaces>=3?config.totalRaces-1:config.totalRaces;
  // Expected elim race net for 10th place sailor
  const estElimNet=estAvgFinish*countingRaces;
  // Plus their prelim rank carry (they'd be around rank 10 from prelim)
  const estPrelimCarry=10;
  const estTotalCutoff=estElimNet+estPrelimCarry;
  const estOptimistic=Math.round(estTotalCutoff*0.85);
  const estPessimistic=Math.round(estTotalCutoff*1.15);

  const [showImport,setShowImport]=useState(false);
  const handleImport=(extracted)=>{
    const n=extracted.races;
    setConfig(c=>({...c,totalRaces:Math.max(c.totalRaces,n),racesCompleted:Math.min(Math.max(c.racesCompleted,n),Math.max(c.totalRaces,n))}));
    setSailors(prev=>prev.map(sailor=>{
      const key=Object.keys(extracted.results).find(k=>k.toLowerCase()===sailor.name.toLowerCase());
      if(!key)return sailor;
      const nr=[...sailor.results];
      extracted.results[key].forEach((r,i)=>{while(nr.length<=i)nr.push(null);if(r!=null)nr[i]=r});
      return{...sailor,results:nr};
    }));
  };
  const addS=()=>{
    if(!newName.trim()||!newPrelimRank)return;
    setSailors(p=>[...p,{name:newName.trim(),prelimRank:Number(newPrelimRank),results:[]}]);
    setNewName("");setNewPrelimRank("");
  };
  const remS=(i)=>setSailors(p=>p.filter((_,j)=>j!==i));
  const setRes=(si,ri,val)=>{setSailors(p=>p.map((s,i)=>{if(i!==si)return s;const nr=[...s.results];while(nr.length<=ri)nr.push(null);nr[ri]=val;return{...s,results:nr}}));if(ri<config.racesCompleted-1)setExpR(ri+1);else setExpR(null)};
  const clrRes=(si,ri)=>setSailors(p=>p.map((s,i)=>{if(i!==si)return s;const nr=[...s.results];nr[ri]=null;return{...s,results:nr}}));

  // Compute standings
  const standings=useMemo(()=>{
    const scored=mySailors.map(s=>{
      const sc=calcNet(s.results,penScore,config.racesCompleted,1);
      const qualScore=sc.net+s.prelimRank; // SI 6.11.2.2c/d: race scores + carried prelim rank
      return{...s,...sc,qualScore};
    });
    scored.sort((a,b)=>a.qualScore-b.qualScore);
    return scored.map((s,i)=>({...s,elimRank:i+1}));
  },[mySailors,config,penScore]);

  const inputS={padding:"10px 12px",borderRadius:6,border:"1px solid "+C.border,background:C.surface,color:C.text,fontSize:14};

  return<div style={{display:"flex",flexDirection:"column",gap:16}}>
    <Card accent={C.amber}><SectionTitle color={C.amber}>Elimination Series Config</SectionTitle>
      <NumberStepper label="Gold Fleet Size" value={config.goldFleetSize} onChange={v=>setConfig(c=>({...c,goldFleetSize:v}))} min={10} max={200}/>
      <NumberStepper label="Total Races" value={config.totalRaces} onChange={v=>setConfig(c=>({...c,totalRaces:v}))} min={1} max={10}/>
      <NumberStepper label="Races Completed" value={config.racesCompleted} onChange={v=>setConfig(c=>({...c,racesCompleted:Math.min(v,config.totalRaces)}))} min={0} max={config.totalRaces}/>
      <div style={{marginTop:8,display:"flex",gap:12,flexWrap:"wrap",fontSize:11,color:C.textMuted}}>
        <span>Pen: {penScore}</span><span>Disc: {config.racesCompleted>=3?"1":"0"}</span><span>Finals: top {finalsTop}</span><span>Prelim rank carries forward</span>
      </div>
    </Card>

    <Card highlight accent={C.violet}><SectionTitle color={C.violet}>Top 10 Finals Cutoff Estimate</SectionTitle>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
        {[{v:estOptimistic,l:"COMFORTABLE",c:C.green},{v:estTotalCutoff,l:"PROJECTED",c:C.primary,hl:true},{v:estPessimistic,l:"TIGHT",c:C.amber}].map((x,i)=>
          <div key={i} style={{background:C.surface,borderRadius:6,padding:"10px 8px",textAlign:"center",border:x.hl?"1px solid "+C.primary+"33":"none"}}>
            <div style={{fontFamily:mono,fontSize:20,fontWeight:700,color:x.c}}>{x.v}</div>
            <div style={{fontFamily:sans,fontSize:10,color:C.textMuted,marginTop:2}}>{x.l}</div></div>)}
      </div>
      <div style={{fontSize:12,color:C.textDim,lineHeight:1.6}}>
        Qualification score = <b style={{color:C.amber}}>elim net</b> + <b style={{color:C.primary}}>prelim rank</b> (non-discardable)<br/>
        Target avg finish: <b style={{color:C.white}}>~{ordinal(estAvgFinish)}</b> / {config.goldFleetSize} per race ({config.totalRaces>=3?"1 discard":"no discard"})
      </div>
    </Card>

    {showImport&&<ImportModal sailors={mySailors} onApply={handleImport} onClose={()=>setShowImport(false)}/>}
    <Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}><SectionTitle color={C.amber}>Sailors</SectionTitle><Badge color={C.amber}>{mySailors.length}</Badge></div>
        <button onClick={()=>setShowImport(true)} style={{padding:"7px 14px",borderRadius:7,border:"1px solid "+C.violet+"55",background:"linear-gradient(135deg,"+C.violet+"25,"+C.primary+"15)",color:C.violet,fontFamily:sans,fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>📋 Import Results</button>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        <input placeholder="Name" value={newName} onChange={e=>setNewName(e.target.value)} style={{...inputS,fontFamily:sans,flex:"2 1 120px"}} onKeyDown={e=>e.key==="Enter"&&addS()}/>
        <input placeholder="Prelim Rank" value={newPrelimRank} onChange={e=>setNewPrelimRank(e.target.value.replace(/[^0-9]/g,""))} style={{...inputS,fontFamily:mono,flex:"1 1 80px",textAlign:"center"}} onKeyDown={e=>e.key==="Enter"&&addS()}/>
        <button onClick={addS} style={{padding:"10px 16px",borderRadius:6,border:"none",background:C.primary,color:C.bg,fontFamily:sans,fontSize:14,fontWeight:700,cursor:"pointer"}}>+</button>
      </div>
      <div style={{fontSize:11,color:C.textMuted,marginBottom:12}}>Enter sailor name + their prelim series rank (carries forward as non-discardable points per SI 6.11.2.1c)</div>

      {/* Standings table if multiple sailors */}
      {standings.length>1&&config.racesCompleted>0&&<div style={{overflowX:"auto",marginBottom:12}}>
        <table style={{fontFamily:mono,fontSize:12}}>
          <thead><tr style={{borderBottom:"2px solid "+C.border}}>
            <th style={{color:C.textDim,fontSize:10,textAlign:"center"}}>#</th>
            <th style={{color:C.textDim,fontSize:10,textAlign:"left"}}>Sailor</th>
            <th style={{color:C.amber,fontSize:10,textAlign:"center"}}>P.Rank</th>
            <th style={{color:C.textDim,fontSize:10,textAlign:"center"}}>E.Net</th>
            <th style={{color:C.primary,fontSize:10,textAlign:"center",fontWeight:700}}>Qual</th>
            <th style={{fontSize:10,textAlign:"center"}}></th>
          </tr></thead>
          <tbody>{standings.map((s,i)=>{
            const inTop10=s.elimRank<=finalsTop;
            return<tr key={i} style={{borderBottom:"1px solid "+C.border+"22",background:inTop10?C.green+"08":"transparent"}}>
              <td style={{textAlign:"center",color:inTop10?C.green:C.textDim,fontWeight:700}}>{s.elimRank}</td>
              <td style={{textAlign:"left",color:C.white,fontFamily:sans,fontSize:13}}>{s.name}</td>
              <td style={{textAlign:"center",color:C.amber}}>{s.prelimRank}</td>

              <div style={{padding:"2px 6px",fontSize:16,color:C.textMuted}}>=</div>
              <div style={{padding:"6px 10px",borderRadius:6,background:C.primary+"15",border:"1px solid "+C.primary+"33",textAlign:"center"}}>

            </div>}

            <div style={{padding:"12px 16px"}}>{Array.from({length:config.racesCompleted},(_,ri)=>{
              const result=sailor.results[ri];const isRE=expR===ri;
              return<div key={ri} style={{marginBottom:4}}>
                <div onClick={()=>setExpR(isRE?null:ri)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",borderRadius:6,cursor:"pointer",background:isRE?C.surface:"transparent",border:"1px solid "+(isRE?C.border:"transparent")}}>
                  <span style={{color:C.textDim,fontFamily:mono,fontSize:13}}>R{ri+1}</span>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>

                    <span style={{color:C.textMuted,fontSize:10}}>{isRE?"▲":"▼"}</span></div>

              </div>})}</div>
            <div style={{padding:"8px 16px 12px",display:"flex",justifyContent:"flex-end"}}><button onClick={()=>remS(si)} style={{background:"none",border:"1px solid "+C.red+"44",borderRadius:6,color:C.red,fontSize:11,padding:"6px 12px",cursor:"pointer"}}>Remove</button></div>
          </div>}
        </Card></div>})}
      {!mySailors.length&&<div style={{color:C.textMuted,textAlign:"center",padding:20,fontSize:13}}>Add sailors with their prelim rank to track elimination</div>}
    </Card>
  </div>;
}

          <td style={{textAlign:"center",color:C.textDim}}>{s.qualRank}</td>

function AdvisorView({standings,sailors,focusIdx,finalsFleet,compressed}){
  const [expR,setExpR]=useState(null);
  if(focusIdx==null)return<Card><div style={{textAlign:"center",padding:"40px 20px",color:C.textMuted}}><div style={{fontSize:32,marginBottom:12}}>★</div><div>Select a focus sailor in Finals tab</div></div></Card>;
  const fS=sailors[focusIdx],fC=compressed.find(c=>c.name===fS.name&&c.qualRank===fS.qualRank),fSt=standings.find(c=>c.name===fS.name&&c.qualRank===fS.qualRank);
  if(!fC||!fSt)return null;
  const rivals=compressed.filter(c=>!(c.name===fS.name&&c.qualRank===fS.qualRank));
  const hF1=fS.f1!=null,hF2=fS.f2!=null,proj=!hF1?"F1":(!hF2?"F2":"done");
  const above=standings.find(s=>s.rank===fSt.rank-1);const gU=above?fSt.overall-above.overall:null;
  const h2h=useMemo(()=>rivals.map(rival=>{
    const sc=[];for(let rf=1;rf<=finalsFleet;rf++){let ww=null;for(let mf=finalsFleet;mf>=1;mf--){
      let m1=hF1?fS.f1:(proj==="F1"?mf:null),m2=hF2?fS.f2:(proj==="F2"?mf:null),r1=rival.f1!=null?rival.f1:(proj==="F1"?rf:null),r2=rival.f2!=null?rival.f2:(proj==="F2"?rf:null);
      const mO=fC.adjustedNet+(m1!=null?(isPen(m1)?finalsFleet+1:Number(m1)):0)+(m2!=null?(isPen(m2)?finalsFleet+1:Number(m2)):0);
      const rO=rival.adjustedNet+(r1!=null?(isPen(r1)?finalsFleet+1:Number(r1)):0)+(r2!=null?(isPen(r2)?finalsFleet+1:Number(r2)):0);
      if(mO<rO||(mO===rO&&fC.qualRank<rival.qualRank)){ww=mf;break;}};sc.push({rf,ww})}
    let ps=null;{let m1p=hF1?fS.f1:(proj==="F1"?"DNF":null),m2p=hF2?fS.f2:(proj==="F2"?"DNF":null);
      const myPO=fC.adjustedNet+(m1p!=null?(isPen(m1p)?finalsFleet+1:Number(m1p)):0)+(m2p!=null?(isPen(m2p)?finalsFleet+1:Number(m2p)):0);
      for(let rf=finalsFleet;rf>=1;rf--){let r1d=rival.f1!=null?rival.f1:(proj==="F1"?rf:null),r2d=rival.f2!=null?rival.f2:(proj==="F2"?rf:null);
        const rO=rival.adjustedNet+(r1d!=null?(isPen(r1d)?finalsFleet+1:Number(r1d)):0)+(r2d!=null?(isPen(r2d)?finalsFleet+1:Number(r2d)):0);
        if(rO<myPO||(rO===myPO&&rival.qualRank<fC.qualRank)){ps={rn:rf};break;}}
      if(!ps)ps={rn:null}}
    return{rival,sc,ps}}),[sailors,compressed,focusIdx,finalsFleet]);
  return<div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8}}>
      {[{l:"Rank",v:fSt.rank,c:C.primary},{l:"Adj",v:fC.adjustedNet,c:C.amber},{l:"Overall",v:fSt.overall,c:C.white},{l:"Gap ↑",v:gU!=null?gU:"—",c:C.green}].map((s,i)=><div key={i} style={{background:C.card,borderRadius:8,padding:"12px 8px",textAlign:"center"}}><div style={{fontFamily:mono,fontSize:22,fontWeight:700,color:s.c}}>{s.v}</div><div style={{fontFamily:sans,fontSize:10,color:C.textMuted,textTransform:"uppercase",marginTop:2}}>{s.l}</div></div>)}
    </div>
    {proj!=="done"&&<div style={{padding:"8px 12px",borderRadius:6,background:C.amber+"15",border:"1px solid "+C.amber+"33"}}><span style={{color:C.amber,fontSize:12}}>Projecting: <b>{proj}</b></span></div>}
    {proj!=="done"&&<Card><SectionTitle>Your {proj} Projections</SectionTitle>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(70px,1fr))",gap:6}}>
        {[1,2,3,5,Math.ceil(finalsFleet/2),finalsFleet,"PEN"].map(f=>{const fs=f==="PEN"?finalsFleet+1:(typeof f==='number'?f:0);const p=fC.adjustedNet+(hF1?(isPen(fS.f1)?finalsFleet+1:Number(fS.f1)):proj==="F1"?fs:0)+(hF2?(isPen(fS.f2)?finalsFleet+1:Number(fS.f2)):proj==="F2"?fs:0);return<div key={String(f)} style={{background:C.surface,borderRadius:6,padding:8,textAlign:"center"}}><div style={{fontFamily:mono,fontSize:11,color:f==="PEN"?C.red:C.textDim,marginBottom:4}}>{f==="PEN"?"PEN":ordinal(f)}</div><div style={{fontFamily:mono,fontSize:15,fontWeight:700,color:C.white}}>{p}</div></div>})}
      </div></Card>}
    <SectionTitle>Head-to-Head{proj!=="done"?" ("+proj+")":""}</SectionTitle>
    {h2h.map(({rival,sc,ps},idx)=>{const rSt=standings.find(s=>s.name===rival.name&&s.qualRank===rival.qualRank);const gap=rSt?(fSt.overall-rSt.overall):0;const isE=expR===idx;const rW=sc.find(s=>s.rf===1);const rM=sc.find(s=>s.rf===Math.ceil(finalsFleet/2));
      return<Card key={idx} style={{padding:0,overflow:"hidden"}}>
        <div onClick={()=>setExpR(isE?null:idx)} style={{padding:"14px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontFamily:mono,fontSize:14,color:C.primary,fontWeight:700}}>Q{rival.qualRank}</span><span style={{fontFamily:sans,fontSize:14,color:C.white,fontWeight:600}}>{rival.name}</span><Badge color={gap<0?C.green:gap>0?C.red:C.amber}>{gap>0?"+":""}{-gap}pts</Badge></div>
          <span style={{color:C.textMuted,fontSize:12}}>{isE?"▲":"▼"}</span></div>
        <div style={{padding:"0 16px 12px",fontFamily:sans,fontSize:13,color:C.textDim,lineHeight:1.8}}>
          {proj!=="done"?<>
            {gap<=0?<>{rW?.ww!=null?<div>If they win {proj} → you need <b style={{color:C.white}}>{ordinal(rW.ww)} or better</b></div>:<div>If they win → <span style={{color:C.red}}>they beat you regardless</span></div>}</>:
            <>{rM?.ww!=null?<div>If they get {ordinal(Math.ceil(finalsFleet/2))} → you need <b style={{color:C.white}}>{ordinal(rM.ww)} or better</b></div>:<div>Mid-fleet → <span style={{color:C.green}}>you stay ahead</span></div>}</>}
            {ps.rn!=null?<div>If you penalty → they need <b style={{color:C.white}}>{ordinal(ps.rn)} or better</b></div>:<div>If you penalty → <span style={{color:C.green}}>still can't pass</span></div>}
          </>:<div>Finals complete</div>}
        </div>
        {isE&&proj!=="done"&&<div style={{padding:"0 16px 16px",borderTop:"1px solid "+C.border}}>
          <div style={{padding:"12px 0 8px",fontSize:11,color:C.textMuted,textTransform:"uppercase"}}>Full {proj} Matrix</div>
          <table style={{fontFamily:mono,fontSize:12}}><thead><tr style={{borderBottom:"1px solid "+C.border}}><th style={{color:C.textDim,textAlign:"left",fontSize:10,padding:"6px 8px"}}>They get</th><th style={{color:C.textDim,textAlign:"center",fontSize:10,padding:"6px 8px"}}>You need</th></tr></thead>
          <tbody>{sc.map((s,i)=>{const ik=[1,3,5,finalsFleet].includes(s.rf);return<tr key={i} style={{borderBottom:"1px solid "+C.border+"11",background:ik?C.surface:"transparent"}}><td style={{padding:"6px 8px",color:C.text}}>{ordinal(s.rf)}</td><td style={{padding:"6px 8px",textAlign:"center",color:s.ww?C.green:C.red,fontWeight:700}}>{s.ww?ordinal(s.ww)+" or better":"Can't beat"}</td></tr>})}</tbody></table>
        </div>}
      </Card>})}
  </div>;
}

  const [showNew,setShowNew]=useState(false);
  const [newName,setNewName]=useState("");
  const [newDate,setNewDate]=useState("");
  const doCreate=()=>{if(!newName.trim())return;onCreate(newName.trim(),newDate);setShowNew(false);setNewName("");setNewDate("")};
  const sorted=[...events].sort((a,b)=>b.lastModified-a.lastModified);
  return<div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:sans}}>
    <div style={{background:"linear-gradient(160deg,#0e2244 0%,#080f1c 100%)",borderBottom:"1px solid "+C.border,position:"relative",overflow:"hidden"}}>
      <div style={{maxWidth:1200,margin:"0 auto",padding:isDesktop?"32px 48px 28px":"22px 18px 18px",position:"relative"}}>
        <div style={{position:"absolute",top:-60,right:-20,width:240,height:240,borderRadius:"50%",background:"radial-gradient(circle,"+C.primary+"12 0%,transparent 70%)",pointerEvents:"none"}}/>
        <div style={{position:"absolute",bottom:-40,left:80,width:160,height:160,borderRadius:"50%",background:"radial-gradient(circle,"+C.violet+"10 0%,transparent 70%)",pointerEvents:"none"}}/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",position:"relative",gap:16,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:isDesktop?18:12}}>
            <div style={{width:isDesktop?60:50,height:isDesktop?60:50,borderRadius:isDesktop?16:14,background:"linear-gradient(135deg,"+C.primary+"30,"+C.violet+"20)",border:"1px solid "+C.primary+"40",display:"flex",alignItems:"center",justifyContent:"center",fontSize:isDesktop?30:24,flexShrink:0}}>⛵</div>
            <div>
              <h1 style={{margin:0,fontSize:isDesktop?28:21,fontWeight:800,color:C.white,letterSpacing:"-0.5px"}}>Regatta Score Tracker</h1>
              <div style={{fontSize:isDesktop?12:10,color:C.textDim,fontFamily:mono,marginTop:3}}>Multi-event scoring & race projections • SI 7.1.7</div>
            </div>
          </div>
          {isDesktop&&<button onClick={()=>setShowNew(true)} style={{padding:"12px 28px",borderRadius:10,border:"none",background:"linear-gradient(135deg,"+C.primary+","+C.violet+")",color:C.white,fontFamily:sans,fontSize:15,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 20px "+C.primary+"35",flexShrink:0}}>+ New Regatta</button>}
        </div>
      </div>
    </div>
    <div style={{maxWidth:1200,margin:"0 auto",padding:isDesktop?"32px 48px":"14px 14px 24px"}}>
      {!isDesktop&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:700,color:C.white}}>{sorted.length>0?sorted.length+" Regatta"+(sorted.length!==1?"s":""):"Your Regattas"}</div>
        <button onClick={()=>setShowNew(true)} style={{padding:"9px 18px",borderRadius:8,border:"none",background:"linear-gradient(135deg,"+C.primary+","+C.violet+")",color:C.white,fontFamily:sans,fontSize:13,fontWeight:700,cursor:"pointer",boxShadow:"0 2px 12px "+C.primary+"35"}}>+ New</button>
      </div>}
      {isDesktop&&<div style={{marginBottom:24}}>
        <div style={{fontSize:20,fontWeight:700,color:C.white,marginBottom:4}}>{sorted.length} Regatta{sorted.length!==1?"s":""}</div>
        <div style={{fontSize:13,color:C.textMuted}}>All events saved locally in your browser</div>
      </div>}
      {showNew&&<Card style={{marginBottom:isDesktop?24:14}} accent={C.primary}>
        <SectionTitle>New Regatta</SectionTitle>
        <div style={{display:"flex",flexDirection:isDesktop?"row":"column",gap:10,alignItems:isDesktop?"flex-end":"stretch"}}>
          <input autoFocus placeholder="Regatta name (e.g. ISAF Youth Worlds 2025)" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doCreate()} style={{flex:isDesktop?3:undefined,padding:"11px 14px",borderRadius:8,border:"1px solid "+C.border,background:C.surface,color:C.text,fontSize:14,fontFamily:sans}}/>
          <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)} style={{flex:isDesktop?1:undefined,padding:"11px 14px",borderRadius:8,border:"1px solid "+C.border,background:C.surface,color:C.text,fontSize:14,fontFamily:mono}}/>
          <div style={{display:"flex",gap:8,flexShrink:0}}>
            <button onClick={doCreate} style={{padding:"11px 22px",borderRadius:8,border:"none",background:C.primary,color:C.bg,fontFamily:sans,fontSize:14,fontWeight:700,cursor:"pointer"}}>Create</button>
            <button onClick={()=>{setShowNew(false);setNewName("");setNewDate("")}} style={{padding:"11px 16px",borderRadius:8,border:"1px solid "+C.border,background:"transparent",color:C.textDim,fontFamily:sans,fontSize:14,cursor:"pointer"}}>Cancel</button>
          </div>
        </div>
      </Card>}
      {sorted.length===0&&!showNew&&<div style={{textAlign:"center",padding:isDesktop?"100px 20px":"60px 20px",color:C.textMuted}}>
        <div style={{width:96,height:96,borderRadius:24,background:"linear-gradient(135deg,"+C.primary+"20,"+C.violet+"14)",border:"1px solid "+C.primary+"30",display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,margin:"0 auto 20px"}}>⛵</div>
        <div style={{fontSize:20,marginBottom:10,color:C.textDim,fontWeight:700}}>No regattas yet</div>
        <div style={{fontSize:14,color:C.textMuted,lineHeight:1.6}}>Create your first regatta to start scoring and projecting results</div>
      </div>}
      <div style={isDesktop?{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}:{display:"flex",flexDirection:"column",gap:10}}>
        {sorted.map(ev=>{
          const pCount=(ev.prelim?.mySailors||[]).length,eCount=(ev.elim?.mySailors||[]).length,fCount=(ev.sailors||[]).length;
          const accent=fCount>0?C.green:eCount>0?C.amber:pCount>0?C.primary:C.border;
          const stageLabel=fCount>0?"Finals":eCount>0?"Elimination":pCount>0?"Preliminary":"New";
          return<Card key={ev.id} style={{cursor:"pointer",paddingLeft:20}} accent={accent}>
            <div onClick={()=>onOpen(ev.id)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div style={{flex:1,minWidth:0,marginRight:10}}>
                  <div style={{fontSize:isDesktop?17:16,fontWeight:700,color:C.white,marginBottom:3,lineHeight:1.3}}>{ev.name}</div>
                  {ev.date&&<div style={{fontSize:11,color:C.textMuted,fontFamily:mono}}>{new Date(ev.date+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}</div>}
                </div>
                <Badge color={accent}>{stageLabel}</Badge>
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                {pCount>0&&<Badge color={C.primary}>{pCount} prelim sailors</Badge>}
                {eCount>0&&<Badge color={C.amber}>{eCount} elim sailors</Badge>}
                {fCount>0&&<Badge color={C.green}>{fCount} finalists</Badge>}
                {pCount+eCount+fCount===0&&<span style={{fontSize:12,color:C.textMuted,fontStyle:"italic"}}>No sailors added yet</span>}
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:8,borderTop:"1px solid "+C.border+"44"}}>
              <span style={{fontSize:11,color:C.textMuted}}>Edited {new Date(ev.lastModified).toLocaleDateString()}</span>
              <div style={{display:"flex",gap:8}}>
                <button onClick={e=>{e.stopPropagation();if(window.confirm("Delete \""+ev.name+"\"?"))onDelete(ev.id)}} style={{background:"none",border:"1px solid "+C.red+"30",borderRadius:6,color:C.red,fontSize:11,padding:"4px 10px",cursor:"pointer"}}>Delete</button>
                <button onClick={()=>onOpen(ev.id)} style={{background:accent+"20",border:"1px solid "+accent+"30",borderRadius:6,color:accent,fontSize:11,padding:"4px 14px",cursor:"pointer",fontWeight:700}}>Open →</button>
              </div>
            </div>
          </Card>})}
      </div>
    </div>
  </div>;
}

// ═══════════════════════════════════════
// EVENT VIEW (single regatta)
// ═══════════════════════════════════════
function EventView({event,updateEvent,onBack}){
  const isDesktop=useBreakpoint();
  const [tab,setTab]=useState(0);
  const [editingTitle,setEditingTitle]=useState(false);
  const [draftName,setDraftName]=useState("");
  const [draftDate,setDraftDate]=useState("");
  const startEdit=()=>{setDraftName(event.name);setDraftDate(event.date||"");setEditingTitle(true)};
  const commitEdit=()=>{if(draftName.trim())updateEvent(e=>({...e,name:draftName.trim(),date:draftDate}));setEditingTitle(false)};
  const cancelEdit=()=>setEditingTitle(false);
  const prelim=event.prelim;const elim=event.elim;const sailors=event.sailors||[];const ff=event.finalsFleet||10;const fi=event.focusIdx??null;
  const setPrelim=(fn)=>updateEvent(e=>({...e,prelim:typeof fn==='function'?fn(e.prelim):fn}));
  const setElim=(fn)=>updateEvent(e=>({...e,elim:typeof fn==='function'?fn(e.elim):fn}));
  const setSailors=(fn)=>updateEvent(e=>({...e,sailors:typeof fn==='function'?fn(e.sailors||[]):fn}));
  const setFF=(v)=>updateEvent(e=>({...e,finalsFleet:v}));
  const setFI=(v)=>updateEvent(e=>({...e,focusIdx:v}));
  const compressed=useMemo(()=>compressScores(sailors),[sailors]);
  const standings=useMemo(()=>{const sc=compressed.map(s=>{const o=calcFinalsOverall(s.adjustedNet,s.f1,s.f2,ff);return{...s,overall:o,f1Score:s.f1!=null?(isPen(s.f1)?ff+1:Number(s.f1)):null,f2Score:s.f2!=null?(isPen(s.f2)?ff+1:Number(s.f2)):null}});
    sc.sort((a,b)=>{if(a.overall!==b.overall)return a.overall-b.overall;const aF=[a.f1Score,a.f2Score].filter(x=>x!=null).sort((x,y)=>x-y),bF=[b.f1Score,b.f2Score].filter(x=>x!=null).sort((x,y)=>x-y);for(let i=0;i<Math.max(aF.length,bF.length);i++){if((aF[i]??Infinity)!==(bF[i]??Infinity))return(aF[i]??Infinity)-(bF[i]??Infinity)}return a.qualRank-b.qualRank});
    return sc.map((s,i)=>({...s,rank:i+1}))},[compressed,ff]);
  const singleFleet=prelim.config.numFleets<=1;
  const allTabs=[
    {id:0,l:"Preliminary",short:"Prelim",i:"🏁",c:C.primary,always:true},
    {id:1,l:"Elimination",short:"Elim",i:"⚔",c:C.amber,always:false},
    {id:2,l:"Finals",short:"Finals",i:"🏅",c:C.green,always:false},
    {id:3,l:"Standings",short:"Table",i:"📊",c:C.violet,always:false},
    {id:4,l:"Advisor",short:"Advise",i:"🧭",c:C.rose,always:false}
  ];
  const tabs=allTabs.filter(t=>t.always||!singleFleet);
  const safeTab=tabs.find(t=>t.id===tab)?tab:0;
  if(safeTab!==tab)setTab(0);
  const content=<>
    {safeTab===0&&<PrelimView prelim={prelim} setPrelim={setPrelim} setElim={setElim} goToElim={()=>setTab(1)}/>}
    {safeTab===1&&<ElimView elim={elim} setElim={setElim}/>}
    {safeTab===2&&<FinalsEntryView sailors={sailors} setSailors={setSailors} focusIdx={fi} setFocusIdx={setFI} finalsFleet={ff} setFinalsFleet={setFF}/>}
    {safeTab===3&&<StandingsView standings={standings} sailors={sailors} focusIdx={fi}/>}
    {safeTab===4&&<AdvisorView standings={standings} sailors={sailors} focusIdx={fi} finalsFleet={ff} compressed={compressed}/>}
  </>;

  if(isDesktop){
    return<div style={{display:"flex",height:"100vh",background:C.bg,color:C.text,fontFamily:sans,overflow:"hidden"}}>
      <div style={{width:252,background:C.surface,borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",flexShrink:0}}>
        <div style={{padding:"22px 22px 18px",borderBottom:"1px solid "+C.border,background:"linear-gradient(160deg,#0e2244,"+C.surface+")"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
            <span style={{fontSize:18}}>⛵</span>
            <span style={{fontSize:10,color:C.textMuted,fontFamily:mono,letterSpacing:"0.5px",textTransform:"uppercase"}}>Regatta Scorer</span>
          </div>
          {editingTitle?<div style={{display:"flex",flexDirection:"column",gap:6}}>
            <input autoFocus value={draftName} onChange={e=>setDraftName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")commitEdit();if(e.key==="Escape")cancelEdit()}} style={{padding:"7px 10px",borderRadius:6,border:"1px solid "+C.primary+"66",background:C.bg,color:C.white,fontSize:14,fontFamily:sans,fontWeight:700,width:"100%"}}/>
            <input type="date" value={draftDate} onChange={e=>setDraftDate(e.target.value)} style={{padding:"6px 10px",borderRadius:6,border:"1px solid "+C.border,background:C.bg,color:C.text,fontSize:12,fontFamily:mono,width:"100%"}}/>
            <div style={{display:"flex",gap:6}}>
              <button onClick={commitEdit} style={{flex:1,padding:"6px",borderRadius:6,border:"none",background:C.primary,color:C.bg,fontFamily:sans,fontSize:12,fontWeight:700,cursor:"pointer"}}>Save</button>
              <button onClick={cancelEdit} style={{padding:"6px 10px",borderRadius:6,border:"1px solid "+C.border,background:"transparent",color:C.textDim,fontFamily:sans,fontSize:12,cursor:"pointer"}}>Cancel</button>
            </div>
          </div>:<div onClick={startEdit} title="Click to rename" style={{cursor:"pointer",group:true}}>
            <div style={{fontSize:15,fontWeight:700,color:C.white,lineHeight:1.3,marginBottom:4,display:"flex",alignItems:"center",gap:6}}>
              <span>{event.name}</span><span style={{fontSize:11,color:C.textMuted,opacity:0.7}}>✎</span>
            </div>
            {event.date&&<div style={{fontSize:11,color:C.textMuted,fontFamily:mono}}>{new Date(event.date+"T00:00:00").toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}</div>}
            {!event.date&&<div style={{fontSize:11,color:C.textMuted,fontStyle:"italic"}}>No date set</div>}
          </div>}
        </div>
        <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:10,padding:"13px 22px",background:"none",border:"none",borderBottom:"1px solid "+C.border,color:C.textDim,cursor:"pointer",fontFamily:sans,fontSize:13,textAlign:"left",width:"100%"}}>
          <span style={{fontSize:15}}>←</span> All Regattas
        </button>
        <nav style={{flex:1,padding:"8px 0",overflowY:"auto"}}>
          {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:13,width:"100%",padding:"13px 22px",background:safeTab===t.id?t.c+"15":"none",border:"none",borderLeft:safeTab===t.id?"3px solid "+t.c:"3px solid transparent",color:safeTab===t.id?t.c:C.textDim,cursor:"pointer",fontFamily:sans,fontSize:14,fontWeight:safeTab===t.id?700:400,textAlign:"left"}}>
            <span style={{fontSize:17,width:22,textAlign:"center",flexShrink:0}}>{t.i}</span>{t.l}
          </button>)}
        </nav>
        <div style={{padding:"12px 22px",borderTop:"1px solid "+C.border,fontSize:10,color:C.textMuted,fontFamily:mono}}>SI 7.1.7 • Auto-saved locally</div>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        <div style={{maxWidth:820,margin:"0 auto",padding:"28px 36px"}}>
          {content}
        </div>
      </div>
    </div>;
  }

  return<div style={{display:"flex",flexDirection:"column",height:"100vh",background:C.bg,color:C.text,fontFamily:sans}}>
    <div style={{padding:"11px 14px 10px",background:"linear-gradient(160deg,#0e2244 0%,"+C.bg+" 100%)",borderBottom:"1px solid "+C.border,flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <button onClick={onBack} style={{width:34,height:34,borderRadius:8,background:C.surface,border:"1px solid "+C.border,color:C.textDim,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,flexShrink:0}}>‹</button>
        <div style={{flex:1,minWidth:0}}>
          {editingTitle?<div style={{display:"flex",gap:6,alignItems:"center"}}>
            <input autoFocus value={draftName} onChange={e=>setDraftName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")commitEdit();if(e.key==="Escape")cancelEdit()}} style={{flex:1,padding:"5px 8px",borderRadius:6,border:"1px solid "+C.primary+"66",background:C.bg,color:C.white,fontSize:14,fontFamily:sans,fontWeight:700,minWidth:0}}/>
            <button onClick={commitEdit} style={{padding:"5px 10px",borderRadius:6,border:"none",background:C.primary,color:C.bg,fontFamily:sans,fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>Save</button>
            <button onClick={cancelEdit} style={{padding:"5px 8px",borderRadius:6,border:"1px solid "+C.border,background:"transparent",color:C.textDim,fontFamily:sans,fontSize:12,cursor:"pointer",flexShrink:0}}>✕</button>
          </div>:<div onClick={startEdit} style={{cursor:"pointer",display:"flex",alignItems:"center",gap:6,minWidth:0}}>
            <div style={{fontSize:15,fontWeight:700,color:C.white,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{event.name}</div>
            <span style={{fontSize:11,color:C.textMuted,flexShrink:0}}>✎</span>
          </div>}
          {!editingTitle&&<div style={{fontSize:10,color:C.textMuted,fontFamily:mono}}>SI 7.1.7 • Auto-saved</div>}
        </div>
      </div>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:14,paddingBottom:0}}>
      {content}
      <div style={{height:16}}/>
    </div>
    <div style={{display:"flex",background:C.surface,borderTop:"1px solid "+C.border,flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)"}}>
      {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 4px 9px",background:safeTab===t.id?t.c+"14":"transparent",border:"none",borderTop:safeTab===t.id?"2px solid "+t.c:"2px solid transparent",color:safeTab===t.id?t.c:C.textMuted,fontFamily:sans,fontSize:9,fontWeight:safeTab===t.id?700:500,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,letterSpacing:"0.2px",textTransform:"uppercase"}}>
        <span style={{fontSize:17}}>{t.i}</span>{t.short}
      </button>)}
    </div>
  </div>;
}

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
function App(){
  const [allData,setAllData]=useState(null);
  const [activeId,setActiveId]=useState(null);
  useEffect(()=>{
    let d=loadAll();
    if(d.events.length===0){const m=migrateOld();if(m){d={events:[m]};saveAll(d);}}
    setAllData(d);
  },[]);
  useEffect(()=>{if(allData)saveAll(allData);},[allData]);
  const updateEvent=(fn)=>setAllData(d=>({...d,events:d.events.map(e=>e.id===activeId?{...fn(e),lastModified:Date.now()}:e)}));
  const createEvent=(name,date)=>{
    const ev={id:genId(),name,date,created:Date.now(),lastModified:Date.now(),prelim:{config:{totalEntries:200,numFleets:3,totalRaces:5,racesCompleted:0},mySailors:[]},elim:{config:{goldFleetSize:67,totalRaces:7,racesCompleted:0},mySailors:[]},sailors:[],finalsFleet:10,focusIdx:null};
    setAllData(d=>({...d,events:[...d.events,ev]}));
    setActiveId(ev.id);
  };
  const deleteEvent=(id)=>{setAllData(d=>({...d,events:d.events.filter(e=>e.id!==id)}));if(activeId===id)setActiveId(null)};
  if(!allData)return null;
  const activeEvent=allData.events.find(e=>e.id===activeId)||null;
  if(!activeEvent)return<EventsHome events={allData.events} onOpen={setActiveId} onCreate={createEvent} onDelete={deleteEvent}/>;
  return<EventView key={activeId} event={activeEvent} updateEvent={updateEvent} onBack={()=>setActiveId(null)}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
